<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Pokemon Guide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navlist">
        <h1 class="logo">
            PokéXplorer
        </h1>
        <input type="button" value="Full Screen">
    </nav>
    <section id="section-body">
        <div class="info-basic">
            <div class="tipo">
                <div class="tipo-pokemon"></div>
            </div>
            <div class="evolucao">
                <h5>Evolução 1</h5>
                <h5>Evolução 2</h5>
                <h5>Evolução 3</h5>
            </div>
        </div>
        <div class="painel-poke">
            <div class="nome-id">
                <h3 class="id-pokemon">ID</h3>
                <h3 class="nome-pokemon">Nome</h3>
            </div>
            <div class="explore-btn">
                <input type="button" value="⬅️" id="beforePokemon" onclick="anteriorPokemon()">
                <img class="img-pokemon" src="" alt="Pokémon">
                <input type="button" value="➡️" id="afterPokemon" onclick="proximoPokemon()">
            </div>
        </div>
        <div class="info-skills">
            <div class="hability">
                <div class="hability-pokemon"></div>
            </div>
            <div class="status">
                <div class="status-title">
                    Status:
                </div>
                <div class="hp"></div>
                <div class="attack"></div>
                <div class="defense"></div>
                <div class="special-attack"></div>
                <div class="special-defense"></div>
                <div class="speed"></div>
            </div>
        </div>
    </section>
</body>
<script src="script.js"></script>

</html>
